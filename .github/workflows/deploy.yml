name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ".bun-version"

    - name: Install dependencies
      run: bun install --frozen-lockfile
    - run: bun run tests
  

    # E2E tests
    - name: Install seaweedfs
      run: |
        tools_folder="${{ github.workspace }}/bin_tools"
        mkdir -p "$tools_folder"
        curl -L -o seaweedfs.tar.gz https://github.com/seaweedfs/seaweedfs/releases/download/3.80/linux_amd64.tar.gz
        tar -xzf seaweedfs.tar.gz -C "$tools_folder"
        echo "$tools_folder" >> "$GITHUB_PATH"
    - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/tursodatabase/libsql/releases/download/libsql-server-v0.24.28/libsql-server-installer.sh | sh
    - name: Get installed Playwright version
      id: playwright-version
      run: |
        playwrightVersion=$(bunx playwright --version)
        echo "version=$playwrightVersion" >> $GITHUB_OUTPUT
    - uses: actions/cache@v4
      id: playwright-cache
      with:
        path: '~/.cache/ms-playwright'
        key: '${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}'
        restore-keys: |
          ${{ runner.os }}-playwright-
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: bunx playwright install --with-deps
    - run: bun run e2e

    - name: Deploy
      if: github.ref == 'refs/heads/main'
      env:
        DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
      run: curl -X POST "$DEPLOY_HOOK"
    
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          test-results
  build-image:
    name: Build Image
    needs: [deploy]
    if: ${{ always() && contains(join(needs.*.result, ','), 'success') }}
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.architecture }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/distapp:build-${{ github.run_id }}-${{ matrix.architecture }}

  create-manifest:
    needs: [build-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/distapp:latest
          sources: |
            ${{ secrets.DOCKERHUB_USERNAME }}/distapp:build-${{ github.run_id }}-amd64
            ${{ secrets.DOCKERHUB_USERNAME }}/distapp:build-${{ github.run_id }}-arm64
